<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>极简项目管理系统</title>
    <!-- 引入外部样式表 -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Artemis</h1>

    <!-- 上方区域：项目列表容器 -->
    <div id="projectList" class="project-list"></div>

    <!-- 下方区域：新建项目按钮 -->
    <div class="create-project-section">
        <button class="btn-primary btn-create-project" onclick="openCreateProjectModal()">新建项目</button>
    </div>

    <!-- ========== 新建项目浮层 ========== -->
    <div id="createProjectModal" class="modal-overlay" style="display: none;">
        <div class="modal-container">
            <!-- 左上角：返回按钮 -->
            <div class="modal-header">
                <button class="btn-secondary" onclick="closeCreateProjectModal()">返回</button>
            </div>

            <!-- 中间区域：表单输入项 -->
            <div class="modal-body">
                <h2 class="modal-title">新建项目</h2>
                <div class="form-grid">
                    <!-- 名称 -->
                    <div class="form-item">
                        <label for="modalProjectName">名称 <span class="required">*</span></label>
                        <input type="text" id="modalProjectName" placeholder="请输入项目名称">
                    </div>

                    <!-- 预计开始时间 -->
                    <div class="form-item">
                        <label for="modalPlanStartDate">预计开始时间</label>
                        <input type="date" id="modalPlanStartDate">
                    </div>

                    <!-- 预计结束时间 -->
                    <div class="form-item">
                        <label for="modalPlanEndDate">预计结束时间</label>
                        <input type="date" id="modalPlanEndDate">
                    </div>

                    <!-- 实际开始时间 -->
                    <div class="form-item">
                        <label for="modalActualStartDate">实际开始时间</label>
                        <input type="date" id="modalActualStartDate">
                    </div>

                    <!-- 实际结束时间 -->
                    <div class="form-item">
                        <label for="modalActualEndDate">实际结束时间</label>
                        <input type="date" id="modalActualEndDate">
                    </div>

                    <!-- 重要度 -->
                    <div class="form-item">
                        <label for="modalPriority">重要度</label>
                        <select id="modalPriority">
                            <option value="低">低</option>
                            <option value="中" selected>中</option>
                            <option value="高">高</option>
                        </select>
                    </div>

                    <!-- 类别 -->
                    <div class="form-item">
                        <label for="modalCategory">类别</label>
                        <select id="modalCategory">
                            <option value="工作" selected>工作</option>
                            <option value="学习">学习</option>
                            <option value="生活">生活</option>
                            <option value="其他">其他</option>
                        </select>
                    </div>

                    <!-- 赏金 -->
                    <div class="form-item">
                        <label for="modalBounty">赏金</label>
                        <input type="number" id="modalBounty" step="0.01" min="0" placeholder="请输入项目赏金金额">
                    </div>
                </div>
            </div>

            <!-- 右下角：确认按钮 -->
            <div class="modal-footer">
                    <button class="btn-primary" onclick="confirmCreateProject()">确认创建</button>
            </div>
        </div>
    </div>

    <!-- ========== 编辑任务浮层 ========== -->
    <div id="editTaskModal" class="modal-overlay" style="display: none;">
        <div class="modal-container">
            <!-- 左上角：返回按钮 -->
            <div class="modal-header">
                <button class="btn-secondary" onclick="closeEditTaskModal()">返回</button>
            </div>

            <!-- 中间区域：表单输入项 -->
            <div class="modal-body">
                <h2 class="modal-title">编辑任务</h2>
                <div class="form-grid">
                    <!-- 名称 -->
                    <div class="form-item">
                        <label for="modalTaskName">名称 <span class="required">*</span></label>
                        <input type="text" id="modalTaskName" placeholder="请输入任务名称">
                    </div>

                    <!-- 预计开始时间 -->
                    <div class="form-item">
                        <label for="modalTaskPlanStartDate">预计开始时间</label>
                        <input type="date" id="modalTaskPlanStartDate">
                    </div>

                    <!-- 预计结束时间 -->
                    <div class="form-item">
                        <label for="modalTaskPlanEndDate">预计结束时间</label>
                        <input type="date" id="modalTaskPlanEndDate">
                    </div>

                    <!-- 实际开始时间 -->
                    <div class="form-item">
                        <label for="modalTaskActualStartDate">实际开始时间</label>
                        <input type="date" id="modalTaskActualStartDate">
                    </div>

                    <!-- 实际结束时间 -->
                    <div class="form-item">
                        <label for="modalTaskActualEndDate">实际结束时间</label>
                        <input type="date" id="modalTaskActualEndDate">
                    </div>

                    <!-- 重要度 -->
                    <div class="form-item">
                        <label for="modalTaskPriority">重要度</label>
                        <select id="modalTaskPriority">
                            <option value="低">低</option>
                            <option value="中" selected>中</option>
                            <option value="高">高</option>
                        </select>
                    </div>

                    <!-- 类别 -->
                    <div class="form-item">
                        <label for="modalTaskCategory">类别</label>
                        <select id="modalTaskCategory">
                            <option value="工作" selected>工作</option>
                            <option value="学习">学习</option>
                            <option value="生活">生活</option>
                            <option value="其他">其他</option>
                        </select>
                    </div>

                    <!-- 赏金 -->
                    <div class="form-item">
                        <label for="modalTaskBounty">赏金</label>
                        <input type="number" id="modalTaskBounty" step="0.01" min="0" placeholder="请输入任务赏金金额">
                    </div>

                    <!-- 完成状态 -->
                    <div class="form-item">
                        <label for="modalTaskCompleted">完成状态</label>
                        <select id="modalTaskCompleted">
                            <option value="false">未完成</option>
                            <option value="true">已完成</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- 右下角：确认按钮 -->
            <div class="modal-footer">
                    <button class="btn-primary" onclick="confirmEditTask()">确认保存</button>
            </div>
        </div>
    </div>

    <!-- ========== 项目详情浮层 ========== -->
    <div id="projectDetailModal" class="modal-overlay" style="display: none;">
        <div class="modal-container">
            <!-- 左上角：返回按钮 -->
            <div class="modal-header">
                <button class="btn-secondary" onclick="closeProjectDetailModal()">返回</button>
            </div>

            <!-- 中间区域：项目详情与任务列表 -->
            <div class="modal-body">
                <h2 id="projectDetailTitle" class="modal-title">项目详情</h2>
                <div id="projectDetailMeta" class="project-detail-meta" style="margin-bottom: 16px;"></div>
                <div id="projectDetailTasks" class="task-list"></div>
            </div>

            <!-- 底部：编辑项目 / 添加任务 -->
            <div class="modal-footer">
                <div style="display:flex; gap:12px;">
                    <button id="detailEditProjectBtn" class="btn-edit">编辑项目</button>
                    <button id="detailAddTaskBtn" class="btn-success">添加任务</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 引入外部 JavaScript -->
    <script src="app.js"></script>
</body>
</html>
