<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ARTEMIS - 极简项目管理系统，高效管理您的项目和任务">
    <title>ARTEMIS</title>
    <!-- 引入外部样式表 -->
    <link rel="stylesheet" href="styles.css?v=20260126">
</head>
<body>
    <!-- ========== 登录/注册界面 ========== -->
    <div id="authContainer" class="auth-container" style="display: none;">
        <div class="auth-box">
            <h1 class="auth-title">Artemis</h1>
            <p class="auth-subtitle">极简项目管理系统</p>
            
            <div class="auth-form">
                <div class="form-item">
                    <label for="authEmail">邮箱</label>
                    <input type="email" id="authEmail" class="auth-input" placeholder="请输入邮箱">
                </div>
                <div class="form-item">
                    <label for="authPassword">密码</label>
                    <input type="password" id="authPassword" class="auth-input" placeholder="请输入密码（至少6位）">
                </div>
                <div class="auth-buttons">
                    <button class="btn-primary" onclick="signIn()">登录</button>
                    <button class="btn-secondary" onclick="signUp()">注册</button>
                </div>
                <p id="authError" class="auth-error"></p>
            </div>
        </div>
    </div>

    <!-- ========== 主应用界面 ========== -->
    <div id="mainApp" style="display: none;">
        <h1>Artemis</h1>

        <!-- 上方区域：项目列表容器 -->
        <div id="projectList" class="project-list"></div>

        <!-- 下方区域：新建项目按钮 -->
        <div class="create-project-section">
            <button class="btn-primary btn-create-project" onclick="openCreateProjectModal()">新建项目</button>
        </div>

        <!-- 用户信息栏（底部） -->
        <div class="user-bar">
            <span id="userEmail"></span>
            <button class="btn-logout" onclick="signOut()">退出登录</button>
        </div>
    </div>

    <!-- ========== 新建项目浮层 ========== -->
    <div id="createProjectModal" class="modal-overlay" style="display: none;">
        <div class="modal-container">
            <!-- 左上角：返回按钮 -->
            <div class="modal-header">
                <button class="btn-secondary" onclick="closeCreateProjectModal()">返回</button>
            </div>

            <!-- 中间区域：表单输入项 -->
            <div class="modal-body">
                <h2 class="modal-title">新建项目</h2>
                <div class="form-grid">
                    <!-- 第一行：名称、重要度、赏金 -->
                    <div class="form-item">
                        <label for="modalProjectName">名称 <span class="required">*</span></label>
                        <input type="text" id="modalProjectName" placeholder="请输入项目名称">
                    </div>

                    <div class="form-item">
                        <label for="modalPriority">重要度</label>
                        <select id="modalPriority">
                            <option value="低">低</option>
                            <option value="中" selected>中</option>
                            <option value="高">高</option>
                        </select>
                    </div>

                    <div class="form-item">
                        <label for="modalBounty">赏金</label>
                        <input type="number" id="modalBounty" step="0.01" min="0" placeholder="请输入项目赏金金额">
                    </div>

                    <!-- 第二行：预计（开始、耗时、结束） -->
                    <div class="form-item">
                        <label for="modalPlanStartDate">预计开始时间</label>
                        <div class="input-with-fix">
                            <input type="text" id="modalPlanStartDate" readonly onclick="openDateTimePicker('modalPlanStartDate')" placeholder="点击选择时间">
                            <button class="fix-btn" id="fixProjectPlanStart" onclick="fixProjectPlanStart()" disabled>修正</button>
                        </div>
                    </div>

                    <div class="form-item">
                        <label for="modalPlanDuration">预计耗时（小时）</label>
                        <div class="input-with-fix">
                            <input type="text" id="modalPlanDuration" readonly onclick="openDurationPicker('modalPlanDuration')" placeholder="点击选择耗时">
                            <button class="fix-btn" id="fixProjectPlanDuration" onclick="fixProjectPlanDuration()" disabled>修正</button>
                        </div>
                    </div>

                    <div class="form-item">
                        <label for="modalPlanEndDate">预计结束时间</label>
                        <div class="input-with-fix">
                            <input type="text" id="modalPlanEndDate" readonly onclick="openDateTimePicker('modalPlanEndDate')" placeholder="点击选择时间">
                            <button class="fix-btn" id="fixProjectPlanEnd" onclick="fixProjectPlanEnd()" disabled>修正</button>
                        </div>
                    </div>

                    <!-- 预计相对时间显示 -->
                    <div class="time-relative-row">
                        <div class="time-relative-box" id="projectPlanStartRelative">-</div>
                        <div class="time-relative-box" id="projectPlanEndRelative">-</div>
                    </div>

                    <!-- 第三行：实际（开始、耗时、结束） -->
                    <div class="form-item">
                        <label for="modalActualStartDate">实际开始时间</label>
                        <div class="input-with-fix">
                            <input type="text" id="modalActualStartDate" readonly onclick="openDateTimePicker('modalActualStartDate')" placeholder="点击选择时间">
                            <button class="fix-btn" id="fixProjectActualStart" onclick="fixProjectActualStart()" disabled>修正</button>
                        </div>
                    </div>

                    <div class="form-item">
                        <label for="modalActualDuration">实际耗时（小时）</label>
                        <div class="input-with-fix">
                            <input type="text" id="modalActualDuration" readonly onclick="openDurationPicker('modalActualDuration')" placeholder="点击选择耗时">
                            <button class="fix-btn" id="fixProjectActualDuration" onclick="fixProjectActualDuration()" disabled>修正</button>
                        </div>
                    </div>

                    <div class="form-item">
                        <label for="modalActualEndDate">实际结束时间</label>
                        <div class="input-with-fix">
                            <input type="text" id="modalActualEndDate" readonly onclick="openDateTimePicker('modalActualEndDate')" placeholder="点击选择时间">
                            <button class="fix-btn" id="fixProjectActualEnd" onclick="fixProjectActualEnd()" disabled>修正</button>
                        </div>
                    </div>

                    <!-- 实际相对时间显示 -->
                    <div class="time-relative-row">
                        <div class="time-relative-box" id="projectActualStartRelative">-</div>
                        <div class="time-relative-box" id="projectActualEndRelative">-</div>
                    </div>

                    <!-- 第四行：类别 -->
                    <div class="form-item">
                        <label for="modalCategory">类别</label>
                        <select id="modalCategory">
                            <option value="工作" selected>工作</option>
                            <option value="学习">学习</option>
                            <option value="生活">生活</option>
                            <option value="其他">其他</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- 右下角：确认按钮 -->
            <div class="modal-footer">
                    <button class="btn-primary" onclick="confirmCreateProject()">确认</button>
            </div>
        </div>
    </div>

    <!-- ========== 编辑任务浮层 ========== -->
    <div id="editTaskModal" class="modal-overlay" style="display: none;">
        <div class="modal-container">
            <!-- 左上角：返回按钮 -->
            <div class="modal-header">
                <button class="btn-secondary" onclick="closeEditTaskModal()">返回</button>
            </div>

            <!-- 中间区域：表单输入项 -->
            <div class="modal-body">
                <h2 class="modal-title">编辑任务</h2>
                <div class="form-grid">
                    <!-- 第一行：名称、重要度、赏金 -->
                    <div class="form-item">
                        <label for="modalTaskName">名称 <span class="required">*</span></label>
                        <input type="text" id="modalTaskName" placeholder="请输入任务名称">
                    </div>

                    <div class="form-item">
                        <label>重要度/紧急度</label>
                        <input type="text" id="priorityMatrixDisplay" readonly onclick="openPriorityMatrix()" placeholder="点击选择优先级">
                        <!-- 隐藏字段存储数据 -->
                        <input type="hidden" id="modalTaskPriority" value="{\"importance\": 0, \"urgency\": 0}">
                    </div>

                    <div class="form-item">
                        <label for="modalTaskBounty">赏金</label>
                        <input type="text" id="modalTaskBounty" readonly onclick="openBountyPicker()" placeholder="点击选择赏金">
                    </div>

                    <!-- 第二行：预计（开始、耗时、结束） -->
                    <div class="form-item">
                        <label for="modalTaskPlanStartDate">预计开始时间</label>
                        <div class="input-with-fix">
                            <input type="text" id="modalTaskPlanStartDate" readonly onclick="openDateTimePicker('modalTaskPlanStartDate')" placeholder="点击选择时间">
                            <button class="fix-btn" id="fixTaskPlanStart" onclick="fixTaskPlanStart()" disabled>修正</button>
                        </div>
                    </div>

                    <div class="form-item">
                        <label for="modalTaskPlanDuration">预计耗时（小时）</label>
                        <div class="input-with-fix">
                            <input type="text" id="modalTaskPlanDuration" readonly onclick="openDurationPicker('modalTaskPlanDuration')" placeholder="点击选择耗时">
                            <button class="fix-btn" id="fixTaskPlanDuration" onclick="fixTaskPlanDuration()" disabled>修正</button>
                        </div>
                    </div>

                    <div class="form-item">
                        <label for="modalTaskPlanEndDate">预计结束时间</label>
                        <div class="input-with-fix">
                            <input type="text" id="modalTaskPlanEndDate" readonly onclick="openDateTimePicker('modalTaskPlanEndDate')" placeholder="点击选择时间">
                            <button class="fix-btn" id="fixTaskPlanEnd" onclick="fixTaskPlanEnd()" disabled>修正</button>
                        </div>
                    </div>

                    <!-- 预计相对时间显示 -->
                    <div class="time-relative-row">
                        <div class="time-relative-box" id="taskPlanStartRelative">-</div>
                        <div class="time-relative-box" id="taskPlanEndRelative">-</div>
                    </div>

                    <!-- 第三行：实际（开始、耗时、结束） -->
                    <div class="form-item">
                        <label for="modalTaskActualStartDate">实际开始时间</label>
                        <div class="input-with-fix">
                            <input type="text" id="modalTaskActualStartDate" readonly onclick="openDateTimePicker('modalTaskActualStartDate')" placeholder="点击选择时间">
                            <button class="fix-btn" id="fixTaskActualStart" onclick="fixTaskActualStart()" disabled>修正</button>
                        </div>
                    </div>

                    <div class="form-item">
                        <label for="modalTaskActualDuration">实际耗时（小时）</label>
                        <div class="input-with-fix">
                            <input type="text" id="modalTaskActualDuration" readonly onclick="openDurationPicker('modalTaskActualDuration')" placeholder="点击选择耗时">
                            <button class="fix-btn" id="fixTaskActualDuration" onclick="fixTaskActualDuration()" disabled>修正</button>
                        </div>
                    </div>

                    <div class="form-item">
                        <label for="modalTaskActualEndDate">实际结束时间</label>
                        <div class="input-with-fix">
                            <input type="text" id="modalTaskActualEndDate" readonly onclick="openDateTimePicker('modalTaskActualEndDate')" placeholder="点击选择时间">
                            <button class="fix-btn" id="fixTaskActualEnd" onclick="fixTaskActualEnd()" disabled>修正</button>
                        </div>
                    </div>

                    <!-- 实际相对时间显示 -->
                    <div class="time-relative-row">
                        <div class="time-relative-box" id="taskActualStartRelative">-</div>
                        <div class="time-relative-box" id="taskActualEndRelative">-</div>
                    </div>

                    <!-- 第四行：完成状态、类别 -->
                    <div class="form-item">
                        <label for="modalTaskCompleted">完成状态</label>
                        <select id="modalTaskCompleted">
                            <option value="false">未完成</option>
                            <option value="true">已完成</option>
                        </select>
                    </div>

                    <div class="form-item">
                        <label for="modalTaskCategory">类别</label>
                        <select id="modalTaskCategory">
                            <option value="工作" selected>工作</option>
                            <option value="学习">学习</option>
                            <option value="生活">生活</option>
                            <option value="其他">其他</option>
                        </select>
                    </div>

                    <div class="form-item">
                        <label>任务关联</label>
                        <input type="text" id="taskDependencyDisplay" readonly onclick="openTaskDependencyModal()" placeholder="点击设置关联">
                    </div>
                </div>

                <!-- 任务详情输入框（全宽） -->
                <div class="form-item form-item-full">
                    <label for="modalTaskDescription">详情</label>
                    <textarea id="modalTaskDescription" class="task-description-input" placeholder="在这里输入任务详情、备注、链接等..."></textarea>
                </div>
            </div>

            <!-- 右下角：确认按钮（仅在新建任务时显示） -->
            <div class="modal-footer" id="taskModalFooter" style="display: none;">
                <button class="btn-primary" onclick="confirmAddTask()">确认</button>
            </div>

        </div>
    </div>

    <!-- ========== 项目详情浮层 ========== -->
    <div id="projectDetailModal" class="modal-overlay" style="display: none;">
        <div class="modal-container">
            <!-- 左上角：返回按钮 -->
            <div class="modal-header">
                <button class="btn-secondary" onclick="closeProjectDetailModal()">返回</button>
            </div>

            <!-- 中间区域：项目详情与任务列表 -->
            <div class="modal-body">
                <h2 id="projectDetailTitle" class="modal-title">项目详情</h2>
                <div id="projectDetailMeta" class="project-detail-meta" style="margin-bottom: 16px;"></div>
                
                <!-- 任务关系图 -->
                <div class="task-graph-container">
                    <div class="task-graph-header">
                        <h3 class="task-graph-title">任务关系图</h3>
                        <div class="task-graph-mode-buttons">
                            <button class="task-graph-mode-btn active" data-mode="combined" onclick="setGraphMode('combined')">综合</button>
                            <button class="task-graph-mode-btn" data-mode="importance" onclick="setGraphMode('importance')">重要</button>
                            <button class="task-graph-mode-btn" data-mode="urgency" onclick="setGraphMode('urgency')">紧急</button>
                            <button class="task-graph-mode-btn" data-mode="bounty" onclick="setGraphMode('bounty')">赏金</button>
                        </div>
                    </div>
                    <div id="taskGraphContainer" class="task-graph">
                        <svg id="taskGraphSvg"></svg>
                    </div>
                </div>
                
                <div id="projectDetailTasks" class="task-list"></div>
            </div>

            <!-- 底部：编辑项目 / 添加任务 -->
            <div class="modal-footer">
                <div style="display:flex; gap:12px;">
                    <button id="detailEditProjectBtn" class="btn-edit">编辑项目</button>
                    <button id="detailAddTaskBtn" class="btn-success">添加任务</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ========== 耗时选择器浮层 ========== -->
    <div id="durationPickerModal" class="modal-overlay" style="display: none;">
        <div class="modal-container duration-picker-container">
            <!-- 头部：标题 -->
            <div class="modal-header">
                <h3 class="modal-title">选择耗时</h3>
            </div>

            <!-- 主体：小时和分钟选择 -->
            <div class="modal-body">
                <div class="picker-table-wrapper">
                    <!-- 左侧：小时列表 -->
                    <div class="picker-table-column">
                        <h3>小时</h3>
                        <div class="picker-table-content" id="durationHourTable">
                            <!-- 动态生成小时列表 -->
                        </div>
                    </div>
                    
                    <!-- 右侧：分钟列表 -->
                    <div class="picker-table-column">
                        <h3>分钟</h3>
                        <div class="picker-table-content" id="durationMinuteTable">
                            <!-- 动态生成分钟列表 -->
                        </div>
                    </div>
                </div>
                
                <!-- 底部输入行 -->
                <div class="duration-custom-row">
                    <input type="number" id="customDurationInput" placeholder="自定义（小时）" min="0">
                    <button class="btn-primary" onclick="confirmDurationPicker()">确认</button>
                </div>
            </div>

            <!-- 底部：取消按钮 -->
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeDurationPicker()">取消</button>
            </div>
        </div>
    </div>

    <!-- ========== 赏金选择器浮层 ========== -->
    <div id="bountyPickerModal" class="modal-overlay" style="display: none;">
        <div class="modal-container bounty-picker-container">
            <!-- 头部：标题 -->
            <div class="modal-header">
                <h3 class="modal-title">选择赏金</h3>
            </div>

            <!-- 主体：赏金选项 -->
            <div class="modal-body">
                <div class="bounty-options" id="bountyOptions">
                    <!-- 动态生成赏金选项 -->
                </div>
                
                <!-- 底部输入行 -->
                <div class="bounty-custom-row">
                    <input type="number" id="customBountyInput" placeholder="自定义赏金" min="0" step="10">
                    <button class="btn-primary" onclick="confirmBountyPicker()">确认</button>
                </div>
            </div>

            <!-- 底部：取消按钮 -->
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeBountyPicker()">取消</button>
            </div>
        </div>
    </div>

    <!-- ========== 日期时间选择表格 ========== -->
    <div id="dateTimePickerModal" class="modal-overlay" style="display: none;">
        <div class="modal-container picker-container">
            <!-- 顶部：返回按钮 -->
            <div class="modal-header">
                <button class="btn-secondary" onclick="closeDateTimePicker()">返回</button>
            </div>

            <!-- 主体：日期时间表格 -->
            <div class="modal-body">
                <h2 class="modal-title">选择日期时间</h2>
                <div class="picker-table-wrapper">
                    <!-- 左侧：日期列表 -->
                    <div class="picker-table-column">
                        <h3>日期</h3>
                        <div class="picker-table-content" id="datePickerTable">
                            <!-- 动态生成日期列表 -->
                        </div>
                        <div class="picker-relative-display" id="dateRelativeDisplay">今天</div>
                    </div>
                    
                    <!-- 中间：小时列表 -->
                    <div class="picker-table-column">
                        <h3>小时</h3>
                        <div class="picker-table-content" id="hourPickerTable">
                            <!-- 动态生成小时列表 -->
                        </div>
                        <div class="picker-relative-display" id="hourRelativeDisplay">当前时刻</div>
                    </div>
                    
                    <!-- 右侧：分钟列表 -->
                    <div class="picker-table-column">
                        <h3>分钟</h3>
                        <div class="picker-table-content" id="minutePickerTable">
                            <!-- 动态生成分钟列表 -->
                        </div>
                        <div class="picker-relative-display" id="minuteRelativeDisplay">0分钟</div>
                    </div>
                </div>
            </div>

            <!-- 底部：确认按钮 -->
            <div class="modal-footer">
                <button class="btn-primary" onclick="confirmDateTimePicker()">确认</button>
            </div>
        </div>
    </div>

    <!-- ========== 任务关联设置浮层 ========== -->
    <div id="taskDependencyModal" class="modal-overlay" style="display: none;">
        <div class="modal-container">
            <!-- 左上角：返回按钮 -->
            <div class="modal-header">
                <button class="btn-secondary" onclick="closeTaskDependencyModal()">返回</button>
            </div>

            <!-- 主体：任务关联设置 -->
            <div class="modal-body">
                <h2 class="modal-title">任务关联设置</h2>
                
                <!-- 选择前置任务按钮 -->
                <div class="dependency-section">
                    <button class="btn-primary" onclick="openPrerequisiteSelector()" style="width: 100%;">
                        选择前置任务
                    </button>
                </div>

                <!-- 已选择的前置任务显示框 -->
                <div class="dependency-section">
                    <label>已选择的前置任务</label>
                    <div class="selected-prerequisites-display" id="selectedPrerequisitesDisplay">
                        <span class="empty-hint">暂无前置任务</span>
                    </div>
                </div>
            </div>

            <!-- 右下角：确认按钮 -->
            <div class="modal-footer">
                <button class="btn-primary" onclick="confirmTaskDependency()">确认</button>
            </div>
        </div>
    </div>

    <!-- ========== 前置任务选择浮层 ========== -->
    <div id="prerequisiteSelectorModal" class="modal-overlay" style="display: none;">
        <div class="modal-container">
            <!-- 左上角：返回按钮 -->
            <div class="modal-header">
                <button class="btn-secondary" onclick="closePrerequisiteSelector()">返回</button>
            </div>

            <!-- 主体：任务列表（多选） -->
            <div class="modal-body">
                <h2 class="modal-title">选择前置任务</h2>
                <div class="prerequisite-list" id="prerequisiteTaskList">
                    <!-- 动态生成任务复选框列表 -->
                </div>
            </div>

            <!-- 右下角：确认按钮 -->
            <div class="modal-footer">
                <button class="btn-primary" onclick="confirmPrerequisiteSelection()">确认</button>
            </div>
        </div>
    </div>

    <!-- ========== 重要度/紧急度矩阵选择器 ========== -->
    <div id="priorityMatrixModal" class="modal-overlay" style="display: none;">
        <div class="modal-container">
            <!-- 左上角：返回按钮 -->
            <div class="modal-header">
                <button class="btn-secondary" onclick="closePriorityMatrix()">返回</button>
            </div>

            <!-- 主体：直角坐标系 -->
            <div class="modal-body">
                <h2 class="modal-title">选择重要度/紧急度</h2>
                
                <!-- 坐标系容器 -->
                <div class="priority-matrix-container">
                    <svg id="priorityMatrixSvg" class="priority-matrix-svg"></svg>
                </div>
                
                <!-- 信息显示框 -->
                <div class="priority-info-box" id="priorityInfoBox">
                    <span>点击坐标系选择位置</span>
                </div>
            </div>

            <!-- 右下角：确认按钮 -->
            <div class="modal-footer">
                <button class="btn-primary" onclick="confirmPriorityMatrix()">确认</button>
            </div>
        </div>
    </div>

    <!-- 引入 D3.js 库（用于任务关系图） -->
    <script src="https://cdn.jsdelivr.net/npm/d3@7" defer></script>

    <!-- 引入 Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    
    <!-- 引入外部 JavaScript -->
    <script src="app.js?v=20260126" defer></script>
</body>
</html>
